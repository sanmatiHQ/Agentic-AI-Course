# Agentic AI Course — Streamlit config (local + Community Cloud)

[theme]
primaryColor = "#2563EB"
backgroundColor = "#EEF2FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[runner]
fastReruns = true
magicEnabled = false

[client]
showSidebarNavigation = true
toolbarMode = "auto"

[logger]
level = "info"
